name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/airinsta-improvements, codex/airinsta-release-1-1]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build the native Android app
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AirInsta-Android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare public Android signing tools
        run: |
          mkdir -p android-signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-signing-tools/
          if [ -d "$ANDROID_HOME/build-tools/35.0.0/lib64" ]; then cp -r "$ANDROID_HOME/build-tools/35.0.0/lib64/." android-signing-tools/lib64/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tools
          path: android-signing-tools/
          retention-days: 7
