name: Website checks
on:
  push:
    branches: [main, codex/airinsta-improvements]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and relay behaviour
        run: |
          node --check assets/app.js
          node --check sw.js
          node --test tests/server.test.js

