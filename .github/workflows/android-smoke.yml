name: Android emulator smoke test
on:
  workflow_dispatch:
  push:
    branches: [codex/airinsta-improvements]
    paths: ['android/**', '.github/workflows/android-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Install emulator image
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-airinsta-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "system-images;android-35;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n airinsta_smoke -k "system-images;android-35;google_apis;x86_64" --path "$ANDROID_AVD_HOME/airinsta_smoke.avd" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx airinsta_smoke
      - name: Launch app and resolve a public reel
        run: bash android/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-diagnostics
          path: |
            android-smoke.png
            android-window.xml
          if-no-files-found: ignore
          retention-days: 3
